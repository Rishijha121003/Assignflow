<!-- ================================================================ -->
        <!-- SUBMISSIONS VIEW (Role-Scoped: Teacher Review & Student Status)  -->
        <!-- ================================================================ -->
        <div id="submissionsView" class="page-view submissions-view-content" style="display: none;">
          <div class="page-header-row">
            <div>
              <h1 class="page-title" id="submissionsPageTitle">Submissions</h1>
              <p class="page-subtitle" id="submissionsPageSubtitle">Review student submitted work, timeliness, and submission files.</p>
            </div>
            <div class="header-actions-group">
              <button class="btn btn-secondary" id="submissionsRefreshBtn" title="Refresh submissions">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span>Refresh</span>
              </button>
            </div>
          </div>

          <!-- Submissions Table Card -->
          <section class="card table-card submissions-table-card">
            <div class="table-toolbar">
              <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="submissionsSearchInput" placeholder="Filter submissions by title, student, or class..." aria-label="Search submissions">
              </div>
              <div class="filter-group">
                <div class="select-wrapper">
                  <select id="submissionsStatusFilter" aria-label="Filter submissions by status">
                    <option value="all">All Submissions</option>
                    <option value="ontime">On-Time</option>
                    <option value="late">Late</option>
                  </select>
                  <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
            </div>

            <div class="table-responsive">
              <table class="assignments-table" id="submissionsPageTable">
                <thead id="submissionsTableHead">
                  <!-- Dynamically rendered according to Teacher vs Student -->
                </thead>
                <tbody id="submissionsTableBody">
                  <!-- Dynamically populated -->
                </tbody>
              </table>

              <!-- Submissions Loading State -->
              <div class="state-container" id="submissionsLoadingState" style="display: none;">
                <div class="spinner"></div>
                <p>Loading submissions...</p>
              </div>

              <!-- Submissions Empty State -->
              <div class="state-container" id="submissionsEmptyState" style="display: none;">
                <div class="empty-icon-circle">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </svg>
                </div>
                <h3 id="submissionsEmptyTitle">No submissions found</h3>
                <p id="submissionsEmptyText">No completed assignments have been submitted yet.</p>
              </div>
            </div>
          </section>
        </div>
