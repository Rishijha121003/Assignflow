<!-- ================================================================ -->
<!-- SEMESTER REPORT VIEW (Screen 5 Reference)                        -->
<!-- ================================================================ -->
<div id="reportsView" class="page-view reports-view-content" style="display: none;">
  <!-- Breadcrumbs -->
  <nav class="academic-breadcrumbs" aria-label="Breadcrumb">
    <ol class="breadcrumb-list">
      <li class="breadcrumb-item"><a href="#dashboard">Reports</a></li>
      <li class="breadcrumb-separator">›</li>
      <li class="breadcrumb-item active" id="reportBreadcrumbCurrent">Semester Report</li>
    </ol>
  </nav>

  <!-- Page Header -->
  <div class="page-header-row">
    <div class="page-header-left">
      <h1 class="page-title" id="reportTitle">Semester 5 – Performance Report</h1>
      <p class="page-subtitle" id="reportSubtitle">Overall performance across all subjects.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-secondary" id="btnExportSemesterCsv" type="button" title="Download sanitized CSV summary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Export CSV</span>
      </button>
      <button class="btn btn-primary" id="btnExportSemesterPdf" type="button" title="Print / Export Report">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>+ Export PDF</span>
      </button>
      <button class="btn btn-outline" id="btnFinalizeSemesterReport" type="button">
        <span>Finalize Results</span>
      </button>
    </div>
  </div>

  <!-- Status / Audit Banner -->
  <div class="report-status-banner" id="reportStatusBanner" style="display: none;">
    <!-- Filled dynamically: Official Finalized or Provisional -->
  </div>

  <!-- 4 Summary Metrics Cards -->
  <section class="dash-metrics-row report-metrics-grid" id="reportMetricsRow" aria-label="Semester Summary Metrics">
    <!-- Populated dynamically via renderSemesterReport() -->
  </section>

  <!-- Bottom Visualizer Section: 2 Columns (60% / 40%) -->
  <div class="report-charts-grid">
    <!-- Left: Subject-wise Performance Comparison Chart -->
    <div class="report-card chart-card" id="reportSubjectChartCard">
      <div class="report-card-header">
        <h2 class="report-card-title">Subject-wise Performance</h2>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-swatch swatch-avg"></span> Class Average</span>
          <span class="legend-item"><span class="legend-swatch swatch-high"></span> Highest Score</span>
        </div>
      </div>
      <div class="chart-container" id="reportSubjectChartContainer">
        <!-- SVG / CSS Bar Chart generated from real API data -->
      </div>
    </div>

    <!-- Right: Student-wise Performance (Top 5) -->
    <div class="report-card table-card" id="reportTopStudentsCard">
      <div class="report-card-header">
        <h2 class="report-card-title">Student-wise Performance (Top 5)</h2>
      </div>
      <div class="table-responsive">
        <table class="academic-table" id="reportTopStudentsTable">
          <thead>
            <tr>
              <th style="width: 40px;">#</th>
              <th>Student Name</th>
              <th>Overall %</th>
              <th>Subjects</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="reportTopStudentsTbody">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
