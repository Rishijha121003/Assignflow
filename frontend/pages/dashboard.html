<!-- ================================================================ -->
        <!-- DASHBOARD VIEW (Teacher & Student Role-Scoped Design)            -->
        <!-- ================================================================ -->
        <div id="dashboardView" class="page-view dashboard-view-content">
          <!-- Hero Banner -->
          <div class="dash-hero-banner">
            <div class="dash-hero-left">
              <span class="dash-greeting-label" id="dashGreeting">Good morning,</span>
              <div class="dash-name-role-row">
                <h1 class="dash-greeting-name" id="dashUserName">Teacher</h1>
                <span class="dash-role-pill teacher" id="dashRolePill" style="display: none;">
                  <svg class="role-pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <span id="dashRolePillText">Teacher</span>
                </span>
              </div>
              <p class="dash-hero-desc" id="dashSubtitle">Here's an overview of your semester.</p>
            </div>
            <div class="dash-hero-right">
              <button class="btn btn-primary dash-hero-cta" id="dashHeroCtaBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span id="dashHeroCtaText">+ Create Assignment</span>
              </button>
            </div>
          </div>

          <!-- 4 Summary Metrics Cards -->
          <section class="dash-metrics-row" id="dashMetricsRow" aria-label="Dashboard Summary Metrics">
            <!-- Populated dynamically via renderDashboard() -->
          </section>

          <!-- Middle Row: 3 Columns (Subjects, Activity, Dark Panel) -->
          <section class="dash-cards-grid dash-mid-row" id="dashMidSection">
            <!-- Left: My Subjects (Teacher) / Upcoming Assignments (Student) -->
            <div class="dash-box-card" id="dashMidLeftCard"></div>
            <!-- Center: Submission Activity (Teacher) / Donut Overview (Student) -->
            <div class="dash-box-card" id="dashMidCenterCard"></div>
            <!-- Right: Upcoming Deadlines & Quick Actions (Dark Contrast Charcoal Panel) -->
            <div class="dash-box-card dark-panel" id="dashMidRightCard"></div>
          </section>

          <!-- Bottom Row: 3 Columns (Recent Submissions, Grading Queue, Timeline) -->
          <section class="dash-cards-grid dash-bottom-row" id="dashBottomSection">
            <!-- Left: Recent Submissions -->
            <div class="dash-box-card" id="dashBottomLeftCard"></div>
            <!-- Center: Grading Queue (Teacher) / Recently Submitted (Student) -->
            <div class="dash-box-card" id="dashBottomCenterCard"></div>
            <!-- Right: Semester Timeline (Teacher) / My Classes (Student) -->
            <div class="dash-box-card" id="dashBottomRightCard"></div>
          </section>

          <!-- Full Width Section (Auxiliary / Tests) -->
          <section class="dash-fullwidth-wrap" id="dashFullWidthWrap" style="display: none;"></section>
        </div>
