<!-- ================================================================ -->
        <!-- DASHBOARD VIEW (Teacher & Student Role-Scoped Design)            -->
        <!-- ================================================================ -->
        <div id="dashboardView" class="page-view dashboard-view-content">
          <!-- Hero Banner -->
          <div class="dash-hero-banner">
            <div class="dash-hero-left">
              <span class="dash-greeting-label" id="dashGreeting">Good morning,</span>
              <div class="dash-name-role-row">
                <h1 class="dash-greeting-name" id="dashUserName">Rishi Jha</h1>
                <span class="dash-role-pill teacher" id="dashRolePill">
                  <svg class="role-pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <span id="dashRolePillText">Teacher</span>
                </span>
              </div>
              <p class="dash-hero-desc" id="dashSubtitle">Manage your classes, create assignments and track student progress.</p>
            </div>
            <div class="dash-hero-right">
              <div class="dash-hero-motif-card" aria-hidden="true">
                <div class="motif-graphic">
                  <svg width="56" height="56" viewBox="0 0 100 100" fill="none">
                    <path d="M100 0 C100 55.23 55.23 100 0 100 L0 0 Z" fill="#2563eb" fill-opacity="0.95"/>
                    <circle cx="50" cy="50" r="16" fill="#1e40af" fill-opacity="0.5"/>
                  </svg>
                </div>
                <div class="motif-quote-text">
                  <span class="motif-quote" id="dashHeroQuote">Small submissions build big futures.</span>
                </div>
              </div>
              <button class="btn btn-primary dash-hero-cta" id="dashHeroCtaBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span id="dashHeroCtaText">Create Assignment</span>
              </button>
            </div>
          </div>

          <!-- 4 Summary Metrics Cards -->
          <section class="dash-metrics-row" id="dashMetricsRow" aria-label="Dashboard Summary Metrics">
            <!-- Populated dynamically via renderDashboard() -->
          </section>

          <!-- Middle Row: 2 Columns (60% / 40%) -->
          <section class="dash-cards-grid dash-mid-row">
            <!-- Left: Recent Submissions (Teacher) / Upcoming Assignments (Student) -->
            <div class="dash-box-card" id="dashMidLeftCard">
              <!-- Dynamically populated -->
            </div>
            <!-- Right: Submissions Overview (Teacher) / Submission Status (Student) -->
            <div class="dash-box-card" id="dashMidRightCard">
              <!-- Dynamically populated -->
            </div>
          </section>

          <!-- Bottom Row: 2 Columns (50% / 50%) -->
          <section class="dash-cards-grid dash-bottom-row">
            <!-- Left: My Classes (Teacher) / Recently Submitted (Student) -->
            <div class="dash-box-card" id="dashBottomLeftCard">
              <!-- Dynamically populated -->
            </div>
            <!-- Right: Upcoming Deadlines (Teacher) / My Classes (Student) -->
            <div class="dash-box-card" id="dashBottomRightCard">
              <!-- Dynamically populated -->
            </div>
          </section>

          <!-- Full Width Section (Quick Actions for Teacher / Keep Going for Student) -->
          <section class="dash-fullwidth-wrap" id="dashFullWidthWrap">
            <!-- Dynamically populated -->
          </section>
        </div>
