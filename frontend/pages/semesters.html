<!-- ================================================================ -->
<!-- SEMESTERS VIEW (Warm Neumorphic Redesign matching Reference)     -->
<!-- ================================================================ -->
<div id="semestersView" class="page-view semesters-view-content" style="display: none;">
  <!-- Ambient Warm Glow Background Decoration -->
  <div class="semesters-ambient-glow" aria-hidden="true"></div>

  <!-- Page Header Row -->
  <div class="semesters-header-row">
    <div class="semesters-header-left">
      <h1 class="semesters-page-title">Semesters</h1>
      <p class="semesters-page-subtitle">Create and manage your academic semesters.</p>
    </div>
    <div class="semesters-header-actions">
      <button class="sem-btn-create-top" id="btnOpenCreateSemester" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create Semester</span>
      </button>
    </div>
  </div>

  <!-- 4 Summary KPI Cards Row -->
  <section class="sem-kpi-grid" aria-label="Semester KPI Statistics">
    <!-- Card 1: Total Semesters -->
    <div class="sem-kpi-card" id="semKpiCardTotal">
      <div class="sem-kpi-icon-wrap icon-amber">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" x2="6"/>
          <line x1="8" x2="8" y1="2" x2="6"/>
          <line x1="3" x2="21" y1="10" x2="10"/>
        </svg>
      </div>
      <div class="sem-kpi-info">
        <div class="sem-kpi-value" id="semKpiTotalCount">0</div>
        <div class="sem-kpi-label">Total Semesters</div>
      </div>
      <button class="sem-kpi-arrow-btn" type="button" aria-label="View all semesters" onclick="filterSemestersByStatus('all')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- Card 2: Active Semester -->
    <div class="sem-kpi-card" id="semKpiCardActive">
      <div class="sem-kpi-icon-wrap icon-green">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <div class="sem-kpi-info">
        <div class="sem-kpi-value" id="semKpiActiveCount">0</div>
        <div class="sem-kpi-label">Active Semester</div>
      </div>
      <button class="sem-kpi-arrow-btn" type="button" aria-label="Filter active semesters" onclick="filterSemestersByStatus('active')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- Card 3: Upcoming -->
    <div class="sem-kpi-card" id="semKpiCardUpcoming">
      <div class="sem-kpi-icon-wrap icon-neutral">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div class="sem-kpi-info">
        <div class="sem-kpi-value" id="semKpiUpcomingCount">0</div>
        <div class="sem-kpi-label">Upcoming</div>
      </div>
      <button class="sem-kpi-arrow-btn" type="button" aria-label="Filter upcoming semesters" onclick="filterSemestersByStatus('upcoming')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- Card 4: Completed -->
    <div class="sem-kpi-card" id="semKpiCardCompleted">
      <div class="sem-kpi-icon-wrap icon-coral">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect width="22" height="5" x="1" y="3"></rect>
          <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
      </div>
      <div class="sem-kpi-info">
        <div class="sem-kpi-value" id="semKpiCompletedCount">0</div>
        <div class="sem-kpi-label">Completed</div>
      </div>
      <button class="sem-kpi-arrow-btn" type="button" aria-label="Filter completed semesters" onclick="filterSemestersByStatus('completed')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </section>

  <!-- Create New Semester Section Card -->
  <div class="sem-section-card" id="createSemesterSection">
    <div class="sem-section-header">
      <div class="sem-section-header-left">
        <div class="sem-header-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" x2="6"/>
            <line x1="8" x2="8" y1="2" x2="6"/>
            <line x1="3" x2="21" y1="10" x2="10"/>
          </svg>
        </div>
        <div>
          <h2 class="sem-section-title">Create New Semester</h2>
          <p class="sem-section-subtitle">Add a new academic semester to organize your classes and assignments.</p>
        </div>
      </div>
    </div>

    <form id="createSemesterInlineForm" class="sem-create-form" onsubmit="return false;">
      <div class="sem-form-grid">
        <!-- Row 1, Col 1: Semester Name -->
        <div class="sem-form-group">
          <label for="newSemName" class="sem-form-label">Semester Name <span class="required-star">*</span></label>
          <div class="sem-input-wrapper">
            <svg class="sem-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h10"></path>
            </svg>
            <input type="text" id="newSemName" class="sem-input" placeholder="e.g. Semester 7, Spring 2026" required maxlength="100">
          </div>
        </div>

        <!-- Row 1, Col 2: Academic Year -->
        <div class="sem-form-group">
          <label for="newSemYear" class="sem-form-label">Academic Year <span class="required-star">*</span></label>
          <div class="sem-input-wrapper">
            <svg class="sem-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            <select id="newSemYear" class="sem-select" required>
              <option value="2026 - 2027" selected>2026 - 2027</option>
              <option value="2025 - 2026">2025 - 2026</option>
              <option value="2024 - 2025">2024 - 2025</option>
              <option value="2023 - 2024">2023 - 2024</option>
            </select>
            <svg class="sem-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Row 2, Col 1: Start Date -->
        <div class="sem-form-group">
          <label for="newSemStartDate" class="sem-form-label">Start Date <span class="required-star">*</span></label>
          <div class="sem-input-wrapper">
            <svg class="sem-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
              <line x1="16" x2="16" y1="2" x2="6"/>
              <line x1="8" x2="8" y1="2" x2="6"/>
              <line x1="3" x2="21" y1="10" x2="10"/>
            </svg>
            <input type="date" id="newSemStartDate" class="sem-input sem-date-input" required>
          </div>
        </div>

        <!-- Row 2, Col 2: End Date -->
        <div class="sem-form-group">
          <label for="newSemEndDate" class="sem-form-label">End Date <span class="required-star">*</span></label>
          <div class="sem-input-wrapper">
            <svg class="sem-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
              <line x1="16" x2="16" y1="2" x2="6"/>
              <line x1="8" x2="8" y1="2" x2="6"/>
              <line x1="3" x2="21" y1="10" x2="10"/>
            </svg>
            <input type="date" id="newSemEndDate" class="sem-input sem-date-input" required>
          </div>
        </div>
      </div>

      <div class="sem-form-actions-row">
        <button type="button" class="sem-btn-cancel" id="btnCancelCreateSemester">Cancel</button>
        <button type="submit" class="sem-btn-submit" id="btnSubmitCreateSemester">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Create Semester</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Existing Semesters Section Card -->
  <div class="sem-section-card" id="existingSemestersSection">
    <div class="sem-section-header sem-table-header-row">
      <div class="sem-section-header-left">
        <div class="sem-header-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" x2="6"/>
            <line x1="8" x2="8" y1="2" x2="6"/>
            <line x1="3" x2="21" y1="10" x2="10"/>
          </svg>
        </div>
        <div>
          <h2 class="sem-section-title">Existing Semesters</h2>
          <p class="sem-section-subtitle">View and manage all academic semesters.</p>
        </div>
      </div>

      <!-- Search & Status Filter Toolbar -->
      <div class="sem-table-toolbar">
        <div class="sem-search-box">
          <svg class="sem-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="semestersSearchInput" placeholder="Search semesters..." aria-label="Search semesters">
        </div>
        <div class="sem-filter-wrapper">
          <select id="semestersStatusFilter" aria-label="Filter semesters by status">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
            <option value="archived">Archived</option>
          </select>
          <svg class="sem-filter-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    </div>

    <!-- Semesters Table / Dynamic List Container -->
    <div class="semesters-list-container" id="semestersListContainer">
      <!-- Populated dynamically via loadSemestersPageView() -->
    </div>
  </div>
</div>
